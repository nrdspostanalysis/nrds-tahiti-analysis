name: Sync Metabase data

on:
  # Offset from :00/:15/:30/:45 — those exact marks are the most congested slots across all of
  # GitHub Actions (every repo's naive "*/15" cron fires there too), so scheduled runs queued at
  # them get delayed the most. GitHub's own docs recommend picking an off-the-mark minute to cut
  # queueing delay; this repo was seeing 8-11h gaps instead of the intended 15min before this change.
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm run sync-metabase
        env:
          METABASE_API_TOKEN: ${{ secrets.METABASE_API_TOKEN }}

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Sync data from Metabase"
            git push
          fi
